<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line board</title>
<link rel="stylesheet" href="/static/station.css">
<style>
/* Line board: read-only, 1 s poll. Same tokens and fonts as the station; colours as the stack light. */
:root{--start:#1F5FA6;--amgrey:#B39A62}
html,body{height:auto}
body{display:block;min-width:0;height:100vh;overflow:hidden;background:var(--foil);display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto auto}
.lb-state{--bg:var(--grey);--fg:#fff;background:var(--bg);color:var(--fg);padding:14px 26px 14px;display:grid;
  grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:start;position:relative}
.s-idle{--bg:var(--grey)} .s-starting,.s-complete{--bg:var(--start)} .s-running{--bg:var(--pass)}
.s-held{--bg:var(--hold);--fg:var(--ink)} .s-suspended{--bg:var(--amgrey);--fg:var(--ink)} .s-stopped{--bg:var(--reject)}
.lb-top{display:flex;align-items:center;gap:22px;min-width:0}
.lb-word{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(56px,8.4vw,116px);
  line-height:.92;letter-spacing:1px;white-space:nowrap}
.lb-chip{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:600;padding:6px 14px;border-radius:5px;
  background:#fff;color:var(--ink);border-left:10px solid var(--grey);white-space:nowrap}
.lb-chip small{font-size:15px;font-weight:500;color:var(--steel)}
.lb-chip.pass{border-color:var(--pass)} .lb-chip.reject{border-color:var(--reject);color:var(--reject)}
.lb-chip.hold{border-color:var(--hold)} .lb-chip.grey{border-color:var(--grey)}
.lb-reason{grid-column:1;font-size:clamp(20px,2.3vw,32px);font-weight:600;line-height:1.2;margin-top:10px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb-reason span{font-weight:400;opacity:.85}
.lb-more{grid-column:1/-1;display:flex;gap:18px;align-items:center;margin-top:10px;font-size:18px;min-height:30px;flex-wrap:wrap}
.lb-more:empty{display:none}
.lb-wait{background:var(--ink);color:#fff;font-weight:700;font-size:19px;letter-spacing:.06em;padding:4px 12px;border-radius:4px}
.s-stopped .lb-wait,.s-running .lb-wait,.s-starting .lb-wait,.s-complete .lb-wait,.s-idle .lb-wait{background:#fff;color:var(--ink)}
.lb-inv{font-weight:600;padding-left:12px;border-left:4px solid currentColor}
.lb-timer{grid-column:2;grid-row:1/3;text-align:right}
.lb-timer small{display:block;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.lb-timer b{display:block;font-size:clamp(40px,5vw,68px);font-weight:600;line-height:1}
.lb-stale{display:none;position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(23,32,42,.88) 0 18px,rgba(23,32,42,.8) 18px 36px);
  color:#fff;font-size:28px;font-weight:700;align-items:center;justify-content:center;text-align:center;padding:0 24px}
body.stale .lb-stale{display:flex}

.lb-id{display:grid;grid-template-columns:1.7fr 1fr .8fr 2.4fr .55fr .7fr;background:var(--panel);border-bottom:1px solid var(--rule)}
.lb-id>div{padding:8px 20px;border-right:1px solid var(--rule);min-width:0}
.lb-id>div:last-child{border-right:0}
.lb-id small,.lb-h{display:block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--steel)}
.lb-id strong{display:block;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-rel{display:flex;gap:14px;font-size:18px;font-weight:500;white-space:nowrap}
.lb-rel i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-right:5px;
  font-size:13px;font-weight:700;color:#fff;background:var(--pass);vertical-align:2px}
.lb-rel .no{color:var(--steel)} .lb-rel .no i{background:none;border:2px solid var(--hold);color:var(--hold)}

.lb-main{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;padding:14px 20px;min-height:0}
.lb-zone{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:12px 18px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.lb-h{margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.lb-h em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none}
.lb-list{list-style:none;margin:0;padding:0;overflow:hidden}
.lb-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;padding:9px 0 9px 12px;border-top:1px solid var(--rule);
  border-left:5px solid var(--hold)}
.lb-list li:first-child{border-top:0}
.lb-list li.crit{border-left-color:var(--reject)}
.lb-list .t{font-size:20px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb-list .m{font-size:14px;color:var(--steel);margin-top:3px;display:flex;gap:10px;align-items:center}
.lb-list .who{font-size:13px;font-weight:700;letter-spacing:.05em;background:var(--ink);color:#fff;padding:1px 8px;border-radius:3px}
.lb-list .age{grid-row:1/3;grid-column:2;font-size:26px;font-weight:600;align-self:center}
.lb-list li.lb-none{display:block;border:0;margin:auto 0;font-size:28px;font-weight:600;color:var(--pass);padding:12px 0}
.lb-list li.lb-none::before{content:"✓";display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--pass);
  color:#fff;font-size:22px;margin-right:12px;vertical-align:4px;font-family:"Segoe UI Symbol","IBM Plex Sans",sans-serif}
.lb-col{display:flex;flex-direction:column;gap:14px;min-height:0}
.lb-due{display:grid;grid-template-columns:1fr auto;font-size:19px;margin:0}
.lb-due dt,.lb-due dd{margin:0;padding:7px 0;border-top:1px solid var(--rule)}
.lb-due dt:first-of-type,.lb-due dd:first-of-type{border-top:0}
.lb-due dd{text-align:right;font-weight:600}
.lb-due .soon{color:#8a5f00} .lb-due .late{color:var(--reject)} .lb-due .off{color:var(--steel);font-weight:500}
.lb-counts{display:grid;grid-template-columns:repeat(5,1fr);margin:2px 0 6px}
.lb-counts div{padding-right:6px}
.lb-counts b{display:block;font-size:34px;font-weight:600;line-height:1.1}
.lb-counts span{font-size:13px;color:var(--steel)}
.lb-counts .p b{color:var(--pass)} .lb-counts .r b{color:var(--reject)} .lb-counts .h b{color:#a87500}
.lb-line{display:flex;justify-content:space-between;gap:12px;font-size:17px;border-top:1px solid var(--rule);padding-top:7px;flex-wrap:wrap}
.lb-line b{font-weight:600} .lb-line .bad{color:var(--reject)} .lb-line .warn{color:#8a5f00}
.lb-bars{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.lb-bars .l{display:flex;justify-content:space-between;gap:10px;font-size:16px;margin-bottom:3px}
.lb-bars .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bars .l b{font-weight:700;margin-right:6px}
.lb-bars .l em{font-style:normal;color:var(--steel);white-space:nowrap;font-size:14px}
.lb-bars .tr{display:flex;align-items:center;gap:10px}
.lb-bars .bar{height:22px;background:var(--reject);border-radius:2px;min-width:3px}
.lb-bars .n{font-size:22px;font-weight:700;color:var(--reject)}
.lb-muted{color:var(--steel);font-size:18px;margin:auto 0}

.lb-time{background:var(--panel);border-top:1px solid var(--rule);padding:10px 20px 8px}
.lb-band{position:relative;height:40px;background:var(--foil);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-top:4px}
.lb-seg{position:absolute;top:0;bottom:0;background:var(--grey);color:#fff;font-size:14px;font-weight:700;display:flex;
  align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(255,255,255,.55)}
.lb-seg.s-held,.lb-seg.s-suspended{color:var(--ink)}
.lb-seg.s-idle{background:#AEB5BD} .lb-seg.s-starting,.lb-seg.s-complete{background:var(--start)} .lb-seg.s-running{background:var(--pass)}
.lb-seg.s-held{background:var(--hold)} .lb-seg.s-suspended{background:var(--amgrey)} .lb-seg.s-stopped{background:var(--reject)}
.lb-ticks{position:relative;height:18px;font-size:13px;color:var(--steel)}
.lb-ticks span{position:absolute;transform:translateX(-50%);top:2px}
.lb-ticks span::before{content:"";position:absolute;left:50%;top:-4px;height:4px;border-left:1px solid var(--steel)}
.lb-lost{font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-lost b{font-weight:600}
.lb-foot{display:flex;gap:26px;align-items:center;padding:7px 20px;background:var(--ink);color:#cfd5dc;font-size:15px;white-space:nowrap;overflow:hidden}
.lb-foot b{color:#fff;font-weight:600}
.lb-foot .bad{color:#ff9d9d}
.lb-foot .brand{margin-left:auto;color:#fff}
@media (max-width:1100px){.lb-id{grid-template-columns:1.5fr 1fr .8fr 2.2fr .6fr .7fr}.lb-id>div{padding:8px 12px}.lb-rel{gap:8px;font-size:16px}}
@media (max-width:760px){
  body{height:auto;overflow:visible;display:block}
  .lb-state{grid-template-columns:1fr;padding:14px 16px}
  .lb-timer{grid-column:1;grid-row:auto;text-align:left;margin-top:8px}
  .lb-top{flex-wrap:wrap;gap:12px}
  .lb-id{grid-template-columns:1fr 1fr}
  .lb-id>div{border-bottom:1px solid var(--rule);padding:8px 16px}
  .lb-id .wide{grid-column:1/-1}
  .lb-main{grid-template-columns:1fr;padding:12px 16px}
  .lb-time{padding:10px 16px}
  .lb-lost{white-space:normal}
  .lb-foot{flex-wrap:wrap;white-space:normal;gap:6px 18px;padding:10px 16px}
  .lb-foot .brand{margin-left:0}
}
</style></head><body>
<section class="lb-state s-idle" id="state" aria-live="polite">
  <div class="lb-top"><div class="lb-word" id="word">…</div><div class="lb-chip" id="chip" hidden></div></div>
  <div class="lb-timer"><small>Time in state</small><b id="timer">–</b></div>
  <div class="lb-reason" id="reason"></div>
  <div class="lb-more" id="more"></div>
  <div class="lb-stale" id="stale"></div>
</section>
<header class="lb-id">
  <div><small>Product</small><strong id="product">–</strong></div>
  <div><small>Batch no.</small><strong id="batch">–</strong></div>
  <div><small>Checklist</small><strong id="version">–</strong></div>
  <div class="wide"><small>Release</small><div class="lb-rel" id="release"></div></div>
  <div><small>Shift</small><strong id="shift">–</strong></div>
  <div><small>Time</small><strong id="clock">–</strong></div>
</header>
<main class="lb-main">
  <section class="lb-zone"><div class="lb-h">Waiting for a person <em>oldest first</em></div><ul class="lb-list" id="waiting"></ul></section>
  <div class="lb-col">
    <section class="lb-zone"><div class="lb-h">Due next</div><dl class="lb-due" id="due"></dl></section>
    <section class="lb-zone"><div class="lb-h" id="batchh">This batch</div><div class="lb-counts" id="counts"></div><div class="lb-line" id="recon"></div></section>
  </div>
  <section class="lb-zone"><div class="lb-h">Rejects by rule <em>this batch · last 60 min</em></div><ul class="lb-bars" id="pareto"></ul></section>
</main>
<section class="lb-time">
  <div class="lb-h">Today <em id="span"></em></div>
  <div class="lb-band" id="timeline"></div>
  <div class="lb-ticks" id="ticks"></div>
  <div class="lb-lost" id="lost"></div>
</section>
<footer class="lb-foot"><span>Line board · read-only</span><span id="chain"></span><span id="record"></span>
  <span class="brand">Built with Muse Spark Open</span></footer>
<script>
const $=id=>document.getElementById(id);
const mk=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
const pad=n=>String(n).padStart(2,"0");
const dur=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+":"+pad(m)+":"+pad(s%60):m+":"+pad(s%60)};
const mins=s=>{const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60)+" min"};
const hm=t=>{const d=new Date(t*1000);return pad(d.getHours())+":"+pad(d.getMinutes())};
const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):"";
// shortcut: shift letter from the clock (A 06-14, B 14-22, C 22-06), as on the station screen; upgrade with the plant's shift times
const shift=()=>{const h=new Date().getHours();return h>=6&&h<14?"A":h>=14&&h<22?"B":"C"};
const WHO={station:"the station",supervisor:"the Shift Supervisor"};
const CHIP={PASS:["PASS","pass"],REJECT:["REJECT","reject"],HOLD:["HOLD","hold"],NO_STRIP:["NO STRIP","grey"],LOCKED:["LOCKED","reject"]};
const SHORT={"Self-test for this batch":"Self-test","Start-up print check":"Print check","QA signature on the start-up specimen":"QA specimen"};
let good=0;  // when the station last answered

function band(j){
  $("state").className="lb-state s-"+j.state.toLowerCase();$("word").textContent=j.state;
  $("timer").textContent=dur(j.now-j.since);
  const c=$("chip"),v=j.chip;c.hidden=!v;c.replaceChildren();
  if(v){const[w,k]=CHIP[v.status]||[v.status,"grey"];c.className="lb-chip "+k;
    c.append(mk("small","Last strip"+(v.strip?" "+v.strip:"")),w+(v.rule&&v.status!=="PASS"?" · Rule "+v.rule:""))}
  const r=$("reason");r.replaceChildren(j.reason||(j.state==="RUNNING"?"Inspecting strips":""));
  if(j.by)r.append(mk("span"," — by "+(WHO[j.by]||j.by)));
  const m=$("more");m.replaceChildren();
  if(j.waiting_for)m.append(mk("span","WAITING FOR "+j.waiting_for,"lb-wait"));
  if(j.investigating)m.append(mk("span",j.investigating,"lb-inv"));
  if(j.also.length)m.append(mk("span","Also: "+j.also.join(" · ")));
}
function ident(j){
  $("product").textContent=j.product?cap(j.product)+(j.count?", strip of "+j.count:""):"–";
  $("batch").textContent=j.batch?j.batch.batch+(j.batch.open?"":" (ended)"):"No batch";
  $("version").textContent=j.checklist_version?"Version "+j.checklist_version:"Not approved";
  const rel=$("release");rel.replaceChildren();
  if(!j.batch||!j.batch.open)rel.append(mk("span","No batch open","no"));
  else j.release.forEach(x=>{const s=mk("span",SHORT[x.item]||x.item,x.done?"":"no");s.prepend(mk("i",x.done?"✓":"!"));rel.append(s)});
  $("shift").textContent=shift();$("clock").textContent=hm(j.now);
}
function waiting(j){
  const ul=$("waiting");ul.replaceChildren();
  if(!j.waiting.length)return ul.append(mk("li","Nothing waiting","lb-none"));
  j.waiting.slice(0,6).forEach(i=>{const li=mk("li","",/^Line held.*Critical|challenge|Quarantine/.test(i.text)?"crit":"");
    const meta=mk("div","","m");meta.append(mk("span",i.who,"who"));
    if(i.evidence){if(i.evidence.startsWith("/")){const a=mk("a","photo");a.href=i.evidence;a.target="_blank";meta.append(a)}
      else meta.append(mk("span",i.evidence))}
    li.append(mk("div",i.text,"t"),mk("div",dur(i.age),"age"),meta);ul.append(li)});
  if(j.waiting.length>6)ul.append(mk("li","+ "+(j.waiting.length-6)+" more on the station","m"));
}
function due(j){
  const dl=$("due");dl.replaceChildren();
  const row=(k,v,cls)=>{dl.append(mk("dt",k),mk("dd",v,cls||""))};
  if(!j.batch||!j.batch.open)row("Leak test / print check","no batch open","off");
  j.due.forEach(d=>{const st=d.name==="Self-test expires";
    if(d.in==null)return row(d.name,st?"no valid self-test":"due now",st?"late":"soon");
    if(d.in<0)return row(d.name,(st?"expired ":"overdue ")+dur(-d.in),"late");
    row(d.name,"in "+(st?Math.floor(d.in/3600)+" h "+pad(Math.floor(d.in%3600/60))+" min":dur(d.in)),d.in<600?"soon":"")});
  const c=j.challenge;
  row("Last physical challenge",c?hm(c.time)+(c.passed!=null?(c.passed?" — passed":" — FAILED"):" — "+c.label+(c.ejected?", ejected":", not ejected")):
    j.challenge_set?"none run yet":"no challenge set registered",c&&c.passed===false?"late":c?"":"off");
}
function counts(j){
  const t=j.counts,box=$("counts");box.replaceChildren();
  $("batchh").textContent=j.batch&&!j.batch.open?"Last batch":"This batch";
  [["Inspected","inspected",""],["Passed","passed","p"],["Rejected","rejected","r"],["Held","held","h"],["No strip","no_strip",""]]
    .forEach(([k,f,c])=>{const d=mk("div","",c);d.append(mk("b",t?t[f]:"–"),mk("span",k));box.append(d)});
  const r=$("recon");r.replaceChildren();
  const rc={open:["Open",""],within:["Within limit",""],outside:["Outside limit","bad"]}[j.reconciliation]||["–",""];
  const a=mk("span","Reconciliation: ");a.append(mk("b",rc[0],rc[1]));
  const n=j.reject_run.n,b=mk("span","Reject run: ");b.append(mk("b",n+" of "+j.reject_run.of,n>=j.reject_run.of-1&&n?"warn":""));
  r.append(a,b);
}
function pareto(j){
  const ul=$("pareto");ul.replaceChildren();
  if(!j.rejects_by_rule.length){ul.append(mk("li","No rejects this batch","lb-muted"));return}
  const max=Math.max(1,...j.rejects_by_rule.map(x=>x.batch));
  j.rejects_by_rule.slice(0,6).forEach(x=>{const li=mk("li"),l=mk("div","","l"),s=mk("span");
    s.append(mk("b","Rule "+x.rule),cap(x.text));l.append(s,mk("em","60 min: "+x.hour));
    const tr=mk("div","","tr"),bar=mk("div","","bar");bar.style.width=(x.batch/max*82)+"%";tr.append(bar,mk("span",x.batch,"n"));
    li.append(l,tr);ul.append(li)});
}
function timeline(j){
  const box=$("timeline"),ticks=$("ticks");box.replaceChildren();ticks.replaceChildren();
  const segs=j.segments;if(!segs.length)return;
  const t0=segs[0].start,span=Math.max(60,j.now-t0),pct=t=>(t-t0)/span*100;
  $("span").textContent=hm(t0)+" to now";
  segs.forEach(g=>{const d=mk("div","","lb-seg s-"+g.state.toLowerCase()),w=pct(g.end)-pct(g.start);
    d.style.left=pct(g.start)+"%";d.style.width=Math.max(w,.3)+"%";
    if(["HELD","STOPPED","SUSPENDED"].includes(g.state)&&w>=5)d.textContent=g.state+" "+mins(g.seconds);
    d.title=g.state+" "+dur(g.seconds)+(g.cause?" — "+g.cause:"")+(g.closed_by?" — then "+g.close_cause+" ("+g.closed_by+")":"");box.append(d)});
  const step=span>10*3600?7200:span>3*3600?3600:span>3600?1800:600;
  for(let t=Math.ceil(t0/step)*step;t<=j.now;t+=step){const s=mk("span",hm(t));s.style.left=pct(t)+"%";if(pct(t)>3&&pct(t)<97)ticks.append(s)}
  const lost=$("lost");lost.replaceChildren();
  if(!j.lost.length){lost.textContent="No held or stopped time today";return}
  const by={};j.lost.forEach(x=>by[x.state]=(by[x.state]||0)+x.seconds);
  lost.append(mk("b",Object.entries(by).map(([k,v])=>cap(k.toLowerCase())+" "+mins(v)).join(", ")+" today"));
  j.lost.slice().sort((a,b)=>b.seconds-a.seconds).slice(0,3).forEach(x=>lost.append(" · "+x.cause+" "+mins(x.seconds)));
  const h=segs.filter(g=>g.state==="HELD"&&!g.open).pop();
  if(h&&h.closed_by)lost.append(" · Last hold "+mins(h.seconds)+", "+h.close_cause.replace(/^Resumed: /,"resumed by "+h.closed_by+": "));
}
function foot(j){
  const f=j.footer,c=$("chain");c.className=f.audit_ok?"":"bad";
  c.textContent=f.audit_ok?"Audit chain verified to entry "+f.audit_entries:"Audit chain BROKEN at entry "+f.audit_broken_at;
  const r=$("record");r.replaceChildren("Record: ");
  r.append(mk("b",f.record==="signed"?"signed"+(f.signed_by?" by "+f.signed_by+" at "+hm(f.signed_at):""):f.record==="draft"?"draft":"none yet"));
}
function stale(err){
  const s=$("stale");s.textContent=err?"Line board cannot read the station records: "+err:good?
    "Not updated for "+dur((Date.now()-good)/1000)+" — the station is not answering":"Waiting for the station to answer";
  document.body.classList.toggle("stale",!!err||Date.now()-good>3000);
}
async function tick(){
  let j=null;try{j=await (await fetch("/line",{cache:"no-store"})).json()}catch(e){}
  if(!j||j.error)return stale(j&&j.error);
  good=Date.now();document.body.classList.remove("stale");
  band(j);ident(j);waiting(j);due(j);counts(j);pareto(j);timeline(j);foot(j);
}
tick();setInterval(tick,1000);
</script></body></html>
